<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ibukayo 2026</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #FFF8F8; font-family: 'Montserrat', sans-serif; color: #5D2322; }
    #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #FFF8F8; z-index: 9999; transition: opacity 0.5s ease, visibility 0.5s ease; }
    #loader.hidden { opacity: 0; visibility: hidden; }
    .spinner { width: 40px; height: 40px; border: 2px solid rgba(93, 35, 34, 0.1); border-top-color: #5D2322; border-radius: 50%; animation: spin 1s linear infinite; }
    .loader-text { margin-top: 16px; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(93, 35, 34, 0.6); }
    @keyframes spin { to { transform: rotate(360deg); } }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div class="loader-text">Loading Experience</div>
  </div>

  <!-- PASTE YOUR APPS SCRIPT WEB APP URL BELOW -->
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbycPSTpdKJxpoqd8QDBa9EJt_SayhE4UZpih6wky_aiZfmKWmpDgVGOa--SuoksKREq/exec" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" onload="document.getElementById('loader').classList.add('hidden')"></iframe>
</body>
</html>
