<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ibukayo 2026 | RSVP</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FFF8F8;
        }
        
        iframe {
            width: 100%;
            height: 100vh;
            border: 0;
            display: block;
        }
        
        .wrapper-loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #FFF8F8;
            display: flex; justify-content: center; align-items: center;
            z-index: 10; transition: opacity 1s ease;
        }
        .wrapper-loader.hidden { opacity: 0; pointer-events: none; }
        
        .spinner {
            width: 40px; height: 40px;
            border: 1px solid rgba(93, 35, 34, 0.1);
            border-top-color: #5D2322;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="wrapper-loader" id="wrapper-loader">
        <div class="spinner"></div>
    </div>

    <!-- ⚠️ IMPORTANT: Replace the src below with your deployed Apps Script Web App URL -->
    <iframe 
        id="rsvp-frame"
        src="https://script.google.com/macros/s/AKfycbycPSTpdKJxpoqd8QDBa9EJt_SayhE4UZpih6wky_aiZfmKWmpDgVGOa--SuoksKREq/exec" 
        allow="clipboard-write"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups">
    </iframe>

    <script>
        document.getElementById('rsvp-frame').addEventListener('load', function() {
            setTimeout(() => {
                document.getElementById('wrapper-loader').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('wrapper-loader').style.display = 'none';
                }, 1000);
            }, 500);
        });
    </script>

</body>
</html>
