<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#411816">
  <title>Ibukunayo 2026 — Bukola & Oluwabusayo</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#411816}
    #loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
      background:radial-gradient(130% 190% at 50% 50%,#6B2B28 0%,#57211F 48%,#3A1412 100%);
      transition:opacity .6s ease,visibility .6s ease}
    #loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
    #loader img{width:min(46vw,220px);filter:brightness(0) invert(1) sepia(.22) saturate(1.05);animation:pulse 2.6s ease-in-out infinite alternate}
    @keyframes pulse{from{opacity:.75;transform:scale(1)}to{opacity:1;transform:scale(1.025)}}
    .bar{width:120px;height:1px;background:rgba(255,244,229,.18);position:relative;overflow:hidden}
    .bar::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:1px;background:rgba(255,244,229,.85);animation:slide 1.4s ease-in-out infinite}
    @keyframes slide{to{left:110%}}
    .cap{font-family:Georgia,serif;font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:rgba(255,244,229,.6)}
    #fallback{display:none;margin-top:6px;font-family:Georgia,serif;font-size:12px;letter-spacing:.15em;color:#FFF4E5;text-decoration:underline}
    iframe{width:100%;height:100%;border:none;display:block}
  </style>
</head>
<body>
  <div id="loader">
    <img id="wrapLogo" src="https://drive.google.com/thumbnail?id=1kORqLABSYS6R7l0DgtvvQp-ufnnW3_E8&sz=w800"
         onerror="this.onerror=null;this.src='https://lh3.googleusercontent.com/d/1kORqLABSYS6R7l0DgtvvQp-ufnnW3_E8';" alt="">
    <div class="bar"></div>
    <div class="cap">Ibukunayo 2026</div>
    <a id="fallback" href="#" target="_blank" rel="noopener">Open directly</a>
  </div>

  <!-- ⬇️ PASTE YOUR APPS SCRIPT WEB APP URL BELOW ⬇️ -->
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbycPSTpdKJxpoqd8QDBa9EJt_SayhE4UZpih6wky_aiZfmKWmpDgVGOa--SuoksKREq/exec"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
    title="Ibukunayo 2026 RSVP"
    onload="document.getElementById('loader').classList.add('hidden')"></iframe>

  <script>
    document.getElementById('fallback').href = document.getElementById('appFrame').src;
    setTimeout(function () {
      if (!document.getElementById('loader').classList.contains('hidden'))
        document.getElementById('fallback').style.display = 'block';
    }, 12000);
  </script>
</body>
</html>
